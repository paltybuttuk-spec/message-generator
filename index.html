<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Message Generator</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#1a1a1a; --muted:#6b7280;
  --border:#e2e4e8; --accent:#2563eb; --accent-text:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --card:#1b1c1f; --text:#f1f1f1; --muted:#9aa0a6;
    --border:#2c2d31; --accent:#3b82f6; --accent-text:#fff;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --card:#1b1c1f; --text:#f1f1f1; --muted:#9aa0a6;
  --border:#2c2d31; --accent:#3b82f6; --accent-text:#fff;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:20px; display:flex; justify-content:center;
}
.wrap{width:100%; max-width:520px;}
h1{font-size:18px; margin:4px 0 16px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:16px; margin-bottom:14px;
}
label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600;}
input, textarea{
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
  background:transparent; color:var(--text); font-size:14px; font-family:inherit;
  margin-bottom:12px;
}
textarea{resize:vertical; min-height:80px; line-height:1.5;}
.row{display:flex; gap:10px;}
.row > div{flex:1;}
button{
  width:100%; padding:12px; border:none; border-radius:8px; font-size:14px;
  font-weight:600; cursor:pointer;
}
.btn-primary{background:var(--accent); color:var(--accent-text);}
.btn-secondary{background:transparent; color:var(--accent); border:1px solid var(--border); margin-top:8px;}
.output{
  white-space:pre-wrap; font-size:14px; line-height:1.6; min-height:60px;
  padding:12px; border:1px dashed var(--border); border-radius:8px; overflow-x:auto;
}
.hint{font-size:11px; color:var(--muted); margin-top:-6px; margin-bottom:12px;}
.toast{
  position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%;
  transform:translateX(-50%); background:var(--text); color:var(--bg);
  padding:8px 16px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .2s;
  pointer-events:none;
}
.toast.show{opacity:0.92;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Message Generator</h1>

  <div class="card">
    <label>Template (define once, edit anytime)</label>
    <textarea id="template" placeholder="e.g. Payout confirmed for {name} at {time} on {date}. Code: {code}. New balance: {balance}"></textarea>
    <div class="hint">Placeholders: {name} {balance} {amount} {code} {time} {date}</div>
    <button class="btn-secondary" id="saveTpl">Save template</button>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>Name</label>
        <input id="name" type="text" placeholder="e.g. John Doe">
      </div>
      <div>
        <label>Code</label>
        <input id="code" type="text" placeholder="e.g. TX1029">
      </div>
    </div>
    <label>Balance</label>
    <input id="balance" type="text" placeholder="e.g. $1,250.00">
    <label>Amount</label>
    <input id="amount" type="text" placeholder="e.g. $500.00">
    <label>Phone number (with country code)</label>
    <input id="phone" type="tel" placeholder="e.g. +254712345678">
    <button class="btn-primary" id="generate">Generate</button>
  </div>

  <div class="card">
    <label>Output</label>
    <div class="output" id="output">Fill in the fields above and hit Generate.</div>
    <button class="btn-primary" id="sendWa" style="margin-top:8px; background:#25D366;">Send via WhatsApp</button>
    <button class="btn-primary" id="sendSms" style="margin-top:8px;">Send via SMS</button>
    <button class="btn-secondary" id="copyBtn">Copy</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_TPL = "Payout confirmed for {name} at {time} on {date}. Code: {code}. Amount: {amount}. New balance: {balance}";

function loadTemplate(){
  try{
    const saved = localStorage.getItem('msggen_template');
    $('template').value = saved || DEFAULT_TPL;
  }catch(e){ $('template').value = DEFAULT_TPL; }
}
function saveTemplate(){
  try{
    localStorage.setItem('msggen_template', $('template').value);
    showToast('Template saved');
  }catch(e){ showToast('Could not save (storage unavailable)'); }
}
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}
function pad(n){ return n.toString().padStart(2,'0'); }
function generate(){
  const now = new Date();
  let hours = now.getHours();
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  if(hours === 0) hours = 12;
  const time = pad(hours) + ':' + pad(now.getMinutes()) + ' ' + ampm;
  const date = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  const tpl = $('template').value || DEFAULT_TPL;
  const msg = tpl
    .replaceAll('{name}', $('name').value || '')
    .replaceAll('{code}', $('code').value || '')
    .replaceAll('{balance}', $('balance').value || '')
    .replaceAll('{amount}', $('amount').value || '')
    .replaceAll('{time}', time)
    .replaceAll('{date}', date);
  $('output').textContent = msg;
}
$('generate').addEventListener('click', generate);
$('saveTpl').addEventListener('click', saveTemplate);
$('copyBtn').addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText($('output').textContent);
    showToast('Copied');
  }catch(e){ showToast('Copy failed'); }
});
$('sendWa').addEventListener('click', ()=>{
  const text = $('output').textContent;
  if(!text || text.startsWith('Fill in')){ showToast('Generate a message first'); return; }
  const phone = ($('phone').value || '').replace(/[^\d+]/g, '').replace(/^\+/, '');
  if(!phone){ showToast('Enter a phone number first'); return; }
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(text), '_blank');
});
$('sendSms').addEventListener('click', ()=>{
  const text = $('output').textContent;
  if(!text || text.startsWith('Fill in')){ showToast('Generate a message first'); return; }
  const phone = ($('phone').value || '').replace(/[^\d+]/g, '');
  window.location.href = 'sms:' + phone + '?body=' + encodeURIComponent(text);
});
loadTemplate();
</script>
</body>
</html>
